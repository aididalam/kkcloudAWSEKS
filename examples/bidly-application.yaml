apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bidly
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aididalam/bidly-argo-cd.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: bidly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
